<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Architectures Hub | Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Portfolio Page Styling */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 700px;
            padding: 40px 20px;
        }
        h1 { color: #ffd600; font-size: 2.5rem; margin-bottom: 10px; }
        p { line-height: 1.6; opacity: 0.8; font-size: 1.1rem; }
        .tag-container { margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .tag {
            background: rgba(255, 214, 0, 0.1);
            border: 1px solid rgba(255, 214, 0, 0.3);
            color: #ffd600;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RAG - Retrieval Augmented Generation</h1>
        
        <p style="margin-top: 30px; font-size: 0.9rem; opacity: 0.6;">
            Click the chat icon in the bottom right to interact with the n8n-powered Agent.
        </p>
    </div>

    <style>
        #ga-launcher {
            position: fixed; bottom: 28px; right: 28px;
            width: 58px; height: 58px; border-radius: 50%;
            background: linear-gradient(135deg, #ffd600, #e6c200);
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 28px rgba(255,214,0,.5);
            transition: transform .2s, box-shadow .2s;
            z-index: 9999;
        }
        #ga-launcher:hover { transform: scale(1.08); box-shadow: 0 10px 36px rgba(255,214,0,.65); }
        #ga-launcher .icon-close { display: none; }
        #ga-launcher.open .icon-chat { display: none; }
        #ga-launcher.open .icon-close { display: block; }

        #ga-window {
            position: fixed; bottom: 100px; right: 28px;
            width: 370px; max-height: 560px;
            border-radius: 20px;
            background: #0d1117;
            border: 1px solid rgba(255,214,0,.18);
            box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
            display: flex; flex-direction: column;
            overflow: hidden;
            opacity: 0; transform: translateY(14px) scale(.97);
            pointer-events: none;
            transition: opacity .25s ease, transform .25s ease;
            z-index: 9998;
        }
        #ga-window.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }

        .ga-header {
            padding: 14px 16px;
            background: linear-gradient(135deg, #18181b, #111);
            border-bottom: 1px solid rgba(255,214,0,.15);
            display: flex; align-items: center; gap: 11px;
        }
        .ga-header-logo {
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(255,214,0,.12);
            border: 1.5px solid rgba(255,214,0,.35);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .ga-header-info .ga-title { font-size: 13.5px; font-weight: 700; color: #fff; font-family: 'Inter', sans-serif; }
        .ga-header-info .ga-sub {
            font-size: 11px; color: rgba(255,255,255,.5);
            display: flex; align-items: center; gap: 5px; margin-top: 2px;
            font-family: 'Inter', sans-serif;
        }
        .ga-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }

        #ga-msgs {
            flex: 1; overflow-y: auto; padding: 14px;
            display: flex; flex-direction: column; gap: 10px;
            scroll-behavior: smooth;
        }
        #ga-msgs::-webkit-scrollbar { width: 3px; }
        #ga-msgs::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }

        .ga-row { display: flex; gap: 8px; align-items: flex-end; animation: gaFade .2s ease; }
        .ga-row.user { flex-direction: row-reverse; }
        @keyframes gaFade { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

        .ga-av {
            width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
            background: rgba(255,214,0,.15); border: 1.5px solid rgba(255,214,0,.3);
            display: flex; align-items: center; justify-content: center;
        }
        .ga-bubble {
            max-width: 78%; min-width: 90px; padding: 9px 13px; border-radius: 16px;
            font-size: 13.5px; line-height: 1.5; word-break: break-word;
            font-family: 'Inter', sans-serif;
        }
        .ga-row:not(.user) .ga-bubble { background: #1a1f2e; color: #e2e8f0; border-bottom-left-radius: 4px; }
        .ga-row.user .ga-bubble { background: #ffd600; color: #000; font-weight: 500; border-bottom-right-radius: 4px; }
        .ga-time { font-size: 10px; color: #3a4050; margin-top: 3px; text-align: right; }

        .ga-typing { display: flex; gap: 8px; align-items: flex-end; }
        .ga-typing-bubble {
            background: #1a1f2e; padding: 11px 14px;
            border-radius: 16px; border-bottom-left-radius: 4px;
            display: flex; gap: 4px; align-items: center;
        }
        .ga-typing-bubble span {
            width: 6px; height: 6px; background: #ffd600;
            border-radius: 50%; animation: gaBlink 1.2s infinite;
        }
        .ga-typing-bubble span:nth-child(2) { animation-delay: .2s; }
        .ga-typing-bubble span:nth-child(3) { animation-delay: .4s; }
        @keyframes gaBlink {
            0%,80%,100% { opacity: .2; transform: scale(.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        .ga-footer {
            padding: 10px 12px;
            background: #0a0d14;
            border-top: 1px solid rgba(255,255,255,.05);
            display: flex; gap: 8px; align-items: flex-end;
        }
        #ga-input {
            flex: 1;
            background: #161b27;
            border: 1.5px solid rgba(255,214,0,.2);
            border-radius: 12px;
            padding: 9px 13px;
            font-size: 13.5px; color: #e2e8f0;
            resize: none; outline: none;
            max-height: 96px; overflow-y: auto;
            transition: border-color .2s;
            font-family: 'Inter', sans-serif; line-height: 1.4;
        }
        #ga-input::placeholder { color: #3a4050; }
        #ga-input:focus { border-color: rgba(255,214,0,.55); }
        #ga-send {
            width: 38px; height: 38px; border-radius: 10px;
            background: #ffd600; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: transform .15s, opacity .15s;
        }
        #ga-send:hover { transform: scale(1.06); }
        #ga-send:active { transform: scale(.95); }
        #ga-send:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    </style>

    <button id="ga-launcher" aria-label="Open AI Assistant">
        <svg class="icon-chat" width="24" height="24" fill="none" stroke="#000" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <svg class="icon-close" width="20" height="20" fill="none" stroke="#000"
             stroke-width="2.6" stroke-linecap="round" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
    </button>

    <div id="ga-window">
        <div class="ga-header">
            <div class="ga-header-logo">
                <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
                    <path d="M6.6 10.3C6.54 10.07 6.42 9.86 6.25 9.69C6.08 9.52 5.87 9.4 5.64 9.34L1.55 8.28C1.48 8.26 1.42 8.22 1.38 8.16C1.33 8.1 1.31 8.03 1.31 7.96C1.31 7.89 1.33 7.82 1.38 7.76C1.42 7.7 1.48 7.66 1.55 7.64L5.64 6.59C5.87 6.53 6.08 6.41 6.25 6.24C6.42 6.07 6.54 5.86 6.6 5.63L7.65 1.54C7.67 1.47 7.71 1.41 7.77 1.37C7.83 1.32 7.9 1.3 7.97 1.3C8.04 1.3 8.11 1.32 8.17 1.37C8.23 1.41 8.27 1.47 8.29 1.54L9.34 5.63C9.4 5.86 9.52 6.07 9.69 6.24C9.86 6.41 10.07 6.53 10.3 6.59L14.39 7.64C14.46 7.66 14.52 7.7 14.56 7.76C14.61 7.82 14.64 7.89 14.64 7.96C14.64 8.03 14.61 8.1 14.56 8.16C14.52 8.22 14.46 8.26 14.39 8.28L10.3 9.34C10.07 9.4 9.86 9.52 9.69 9.69C9.52 9.86 9.4 10.07 9.34 10.3L8.29 14.39C8.27 14.46 8.23 14.52 8.17 14.56C8.11 14.61 8.04 14.64 7.97 14.64C7.9 14.64 7.83 14.61 7.77 14.56C7.71 14.52 7.67 14.46 7.65 14.39L6.6 10.3Z" stroke="#FFD600" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="ga-header-info">
                <div class="ga-title">AI Assistant</div>
                <div class="ga-sub"><span class="ga-dot"></span> Online · Powered by n8n</div>
            </div>
        </div>

        <div id="ga-msgs"></div>

        <div class="ga-footer">
            <textarea id="ga-input" placeholder="Type your question..." rows="1"></textarea>
            <button id="ga-send" aria-label="Send">
                <svg width="16" height="16" fill="none" stroke="#000" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
    (function () {
        /* REPLACE THE WEBHOOK URL BELOW:
           Copy the 'Production URL' from your n8n Webhook node.
        */
        var WEBHOOK = 'YOUR_N8N_PRODUCTION_WEBHOOK_URL_HERE';
        var INIT_MSGS = ['Hi there!', 'I am your RAG-powered AI Assistant. How can I help you today?'];

        var launcher = document.getElementById('ga-launcher');
        var win      = document.getElementById('ga-window');
        var msgs     = document.getElementById('ga-msgs');
        var input    = document.getElementById('ga-input');
        var sendBtn  = document.getElementById('ga-send');
        var isOpen   = false;
        var sessionId = 'sess_' + Math.random().toString(36).slice(2);

        function ts() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function addMsg(text, role) {
            var row = document.createElement('div');
            row.className = 'ga-row' + (role === 'user' ? ' user' : '');

            var av = document.createElement('div');
            av.className = 'ga-av';
            av.innerHTML = role === 'user'
              ? '<svg width="13" height="13" fill="none" stroke="#ffd600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>'
              : '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6.6 10.3C6.54 10.07 6.42 9.86 6.25 9.69C6.08 9.52 5.87 9.4 5.64 9.34L1.55 8.28C1.48 8.26 1.42 8.22 1.38 8.16C1.33 8.1 1.31 8.03 1.31 7.96C1.31 7.89 1.33 7.82 1.38 7.76C1.42 7.7 1.48 7.66 1.55 7.64L5.64 6.59C5.87 6.53 6.08 6.41 6.25 6.24C6.42 6.07 6.54 5.86 6.6 5.63L7.65 1.54C7.67 1.47 7.71 1.41 7.77 1.37C7.83 1.32 7.9 1.3 7.97 1.3C8.04 1.3 8.11 1.32 8.17 1.37C8.23 1.41 8.27 1.47 8.29 1.54L9.34 5.63C9.4 5.86 9.52 6.07 9.69 6.24C9.86 6.41 10.07 6.53 10.3 6.59L14.39 7.64C14.46 7.66 14.52 7.7 14.56 7.76C14.61 7.82 14.64 7.89 14.64 7.96C14.64 8.03 14.61 8.1 14.56 8.16C14.52 8.22 14.46 8.26 14.39 8.28L10.3 9.34C10.07 9.4 9.86 9.52 9.69 9.69C9.52 9.86 9.4 10.07 9.34 10.3L8.29 14.39C8.27 14.46 8.23 14.52 8.17 14.56C8.11 14.61 8.04 14.64 7.97 14.64C7.9 14.64 7.83 14.61 7.77 14.56C7.71 14.52 7.67 14.46 7.65 14.39L6.6 10.3Z" stroke="#FFD600" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

            var wrap   = document.createElement('div');
            var bubble = document.createElement('div');
            bubble.className = 'ga-bubble';
            bubble.textContent = text;
            var time = document.createElement('div');
            time.className = 'ga-time';
            time.textContent = ts();
            wrap.appendChild(bubble);
            wrap.appendChild(time);

            if (role === 'user') { row.appendChild(wrap); row.appendChild(av); }
            else                  { row.appendChild(av);   row.appendChild(wrap); }

            msgs.appendChild(row);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function showTyping() {
            var row = document.createElement('div');
            row.className = 'ga-typing'; row.id = 'ga-typing';
            var av = document.createElement('div');
            av.className = 'ga-av';
            av.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6.6 10.3C6.54 10.07 6.42 9.86 6.25 9.69C6.08 9.52 5.87 9.4 5.64 9.34L1.55 8.28C1.48 8.26 1.42 8.22 1.38 8.16C1.33 8.1 1.31 8.03 1.31 7.96C1.31 7.89 1.33 7.82 1.38 7.76C1.42 7.7 1.48 7.66 1.55 7.64L5.64 6.59C5.87 6.53 6.08 6.41 6.25 6.24C6.42 6.07 6.54 5.86 6.6 5.63L7.65 1.54C7.67 1.47 7.71 1.41 7.77 1.37C7.83 1.32 7.9 1.3 7.97 1.3C8.04 1.3 8.11 1.32 8.17 1.37C8.23 1.41 8.27 1.47 8.29 1.54L9.34 5.63C9.4 5.86 9.52 6.07 9.69 6.24C9.86 6.41 10.07 6.53 10.3 6.59L14.39 7.64C14.46 7.66 14.52 7.7 14.56 7.76C14.61 7.82 14.64 7.89 14.64 7.96C14.64 8.03 14.61 8.1 14.56 8.16C14.52 8.22 14.46 8.26 14.39 8.28L10.3 9.34C10.07 9.4 9.86 9.52 9.69 9.69C9.52 9.86 9.4 10.07 9.34 10.3L8.29 14.39C8.27 14.46 8.23 14.52 8.17 14.56C8.11 14.61 8.04 14.64 7.97 14.64C7.9 14.64 7.83 14.61 7.77 14.56C7.71 14.52 7.67 14.46 7.65 14.39L6.6 10.3Z" stroke="#FFD600" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            var b = document.createElement('div');
            b.className = 'ga-typing-bubble';
            b.innerHTML = '<span></span><span></span><span></span>';
            row.appendChild(av); row.appendChild(b);
            msgs.appendChild(row);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function removeTyping() {
            var t = document.getElementById('ga-typing');
            if (t) t.remove();
        }

        function sendMessage() {
            var text = input.value.trim();
            if (!text) return;
            input.value = ''; input.style.height = 'auto';
            sendBtn.disabled = true;
            addMsg(text, 'user');
            showTyping();

            fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chatInput: text, sessionId: sessionId })
            })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                removeTyping();
                var raw = d.output || d.text || d.message || d.response || d;
                var reply;
                if (typeof raw === 'string') {
                    try {
                        var parsed = JSON.parse(raw);
                        var first = Array.isArray(parsed) ? parsed[0] : parsed;
                        reply = first.response || first.output || first.text || first.message || raw;
                    } catch (e) { reply = raw; }
                } else if (Array.isArray(raw)) {
                    reply = raw[0]?.response || raw[0]?.output || raw[0]?.text || raw[0]?.message || String(raw);
                } else {
                    reply = raw.response || raw.output || raw.text || raw.message || 'Sorry, I could not process that.';
                }
                reply = String(reply).replace(/\\n/g, '\n');
                addMsg(reply, 'bot');
            })
            .catch(function() {
                removeTyping();
                addMsg('Connection error. Please try again.', 'bot');
            })
            .finally(function() {
                sendBtn.disabled = false;
                input.focus();
            });
        }

        launcher.addEventListener('click', function () {
            isOpen = !isOpen;
            launcher.classList.toggle('open', isOpen);
            win.classList.toggle('open', isOpen);
            if (isOpen && msgs.children.length === 0) {
                setTimeout(function () {
                    INIT_MSGS.forEach(function (m, i) {
                        setTimeout(function () { addMsg(m, 'bot'); }, i * 420);
                    });
                }, 180);
            }
            if (isOpen) setTimeout(function () { input.focus(); }, 300);
        });

        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 96) + 'px';
        });
    }());
    </script>
</body>
</html>
